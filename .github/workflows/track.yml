name: Track flight prices

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -e .

      - name: Rodar o tracker
        id: track
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          set +e
          python -m flight_tracker
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # So commita o historico quando o tracker terminou com sucesso total
      # (0) ou falha parcial de provider (2). Em falha fatal (1) - que
      # inclui falha de envio de e-mail - a propria transacao do runner ja
      # nao persistiu nada (ver SPEC 6.3); este passo nao reimplementa
      # essa garantia, so respeita o exit code.
      - name: Commitar historico de precos
        if: steps.track.outputs.code == '0' || steps.track.outputs.code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          git diff --cached --quiet && exit 0
          git commit -m "chore: update price history [skip ci]"
          git push

      # Mantem o job vermelho sempre que o tracker nao terminou com exit 0,
      # mesmo quando o passo anterior fez commit (caso 2).
      - name: Falhar o job se o tracker nao terminou com sucesso total
        if: steps.track.outputs.code != '0'
        run: exit 1
